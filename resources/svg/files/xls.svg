<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true" role="img">
  <!--
    Foglio di calcolo, export immediato (ExportXlsAction: il file si scarica subito).
    Stile Heroicons outline (story Xot 8.5): pagina = path `document` di Heroicons, identico.
    Disegno precedente (variante legacy xls): pagina custom con piega a spigolo, griglia
    2 colonne a sinistra, senza barra header piena, piu' una freccia export a destra.
    Sostituito perche' a 16-20 px le linee della griglia (a 1.75-2.25 unita' l'una
    dall'altra) si fondevano in una macchia piena.
  -->
  <!-- Pagina: piega arrotondata in alto a destra + contorno (path Heroicons o-document) -->
  <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z"/>
  <!--
    Griglia 2x2 a tutta larghezza (x 8.25-15.75, y 11.25-18.75, angoli 0.75):
    celle da 3.75 come in Heroicons table-cells, chiare anche a 16 px.
    La freccia export e' stata tolta: tutte le icone xot-files sono export,
    quindi lo spazio serve meglio al solo glifo che le distingue.
  -->
  <path stroke-linecap="round" stroke-linejoin="round" d="M9 11.25h6a.75.75 0 0 1 .75.75v6a.75.75 0 0 1-.75.75H9a.75.75 0 0 1-.75-.75v-6a.75.75 0 0 1 .75-.75ZM8.25 15h7.5M12 11.25v7.5"/>
</svg>
